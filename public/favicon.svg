<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="6" />

  <!-- Background decorative tech grid & glow -->
  <circle cx="390" cy="120" r="80" fill="url(#glowGrad)" filter="blur(20px)" />
  <circle cx="120" cy="400" r="70" fill="url(#glowGrad)" filter="blur(25px)" />

  <!-- Main emblem: Monogram IA + Sparkle/Career Ladder -->
  <g filter="url(#shadow)">
    <!-- Letter "I" -->
    <rect x="110" y="145" width="52" height="222" rx="26" fill="#ffffff" />
    <!-- Top accent dot / spark on I -->
    <circle cx="136" cy="105" r="24" fill="url(#accentGrad)" />

    <!-- Letter "A" -->
    <!-- Left leg -->
    <path d="M 230 367 L 298 145 C 302 132, 316 124, 330 128 C 343 132, 351 146, 347 160 L 279 367 C 275 380, 261 388, 247 384 C 234 380, 226 366, 230 353 Z" fill="#ffffff" />
    <!-- Right leg -->
    <path d="M 334 160 L 402 367 C 406 380, 398 394, 385 398 C 371 402, 357 394, 353 381 L 285 174" fill="#ffffff" opacity="0.95" />
    <!-- Crossbar -->
    <rect x="252" y="278" width="112" height="44" rx="22" fill="url(#accentGrad)" />

    <!-- AI Sparkle Icon (Top Right) -->
    <path d="M 400 80 Q 400 115 435 115 Q 400 115 400 150 Q 400 115 365 115 Q 400 115 400 80 Z" fill="#facc15" />
    <circle cx="430" cy="70" r="7" fill="#ffffff" />
  </g>
</svg>
